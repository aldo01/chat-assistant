<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat widget example</title>
    <style>
      body {
        max-width: 760px;
        margin: 80px auto;
        padding: 0 24px;
        color: #172033;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chat widget example</h1>
      <p>
        Start the API on <code>http://localhost:8080</code>, then serve this
        directory over HTTP and open this page. Click the chat bubble to begin.
      </p>
    </main>

    <script
      src="./chat-widget.js"
      data-api="http://localhost:8088/chat"
      data-brand="Acme Support"
      data-greeting="Hi! Ask me anything about Acme."
      data-accent="#4f46e5"
    ></script>
  </body>
</html>
